<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>我的人生卡片</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#2d5a43" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="人生卡片" />
  <style>
    :root {
      --bg: #f8f6f0;
      --card-bg: #ffffff;
      --primary: #2d5a43;
      --accent: #d97736;
      --text: #2d2d2d;
      --muted: #6e6e6e;
      --border: #e3ded6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      max-width: 540px;
      margin: 0 auto;
      padding: 16px 16px 90px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    h1 { font-size: 21px; color: var(--primary); font-weight: 700; }
    .status-badge {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 14px;
      background: #e2efe7;
      color: var(--primary);
      font-weight: 500;
    }

    .tabs-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 16px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      flex: 1;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab-btn {
      padding: 7px 14px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 20px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      font-weight: 600;
    }
    .manage-cat-btn {
      padding: 7px 12px;
      background: #ece6dc;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 12px;
      color: var(--text);
      cursor: pointer;
      white-space: nowrap;
      font-weight: 500;
    }

    .card-list { display: flex; flex-direction: column; gap: 14px; }
    .life-card {
      background: var(--card-bg);
      border-radius: 14px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }

    /* 竖屏照片完整展示容器 */
    .card-img-wrap {
      width: 100%;
      background: #111;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .card-img {
      width: 100%;
      max-height: 480px;
      object-fit: contain;
      display: block;
    }

    .card-body { padding: 15px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .tag {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      background: #f0ece5;
      color: #555;
    }
    .tag.when { background: #faeee4; color: var(--accent); }
    .tag.who { background: #e7f3eb; color: var(--primary); font-weight: 500; }
    .card-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; color: #1f1f1f; }
    .card-text { font-size: 14px; line-height: 1.6; color: #444; white-space: pre-wrap; }

    .card-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 12px;
      border-top: 1px dashed var(--border);
      padding-top: 8px;
    }
    .btn-action {
      font-size: 13px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 6px;
      font-weight: 500;
    }
    .btn-edit { color: var(--primary); }
    .btn-del { color: #b84040; }

    .fab {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--primary);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 30px;
      padding: 12px 28px;
      box-shadow: 0 4px 14px rgba(45,90,67,0.3);
      cursor: pointer;
      z-index: 10;
    }

    .modal-mask {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 99;
      justify-content: center;
      align-items: flex-end;
    }
    .modal-mask.open { display: flex; }
    .modal {
      background: #fff;
      width: 100%;
      max-width: 540px;
      max-height: 88vh;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      overflow-y: auto;
    }
    .modal h2 { font-size: 17px; margin-bottom: 14px; color: var(--primary); }
    .group { margin-bottom: 12px; }
    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
    }
    textarea { height: 85px; resize: none; }
    .modal-btns { display: flex; gap: 10px; margin-top: 16px; }
    .modal-btns button {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      font-size: 15px;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-cancel { background: #ece8e1; color: var(--text); }
    .btn-submit { background: var(--primary); color: #fff; }
    .empty-hint { text-align: center; color: var(--muted); margin-top: 50px; font-size: 14px; line-height: 1.8; }

    .cat-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
      background: #faf8f5;
    }
    .cat-item span { font-size: 14px; font-weight: 500; }
    .cat-item-del {
      background: none;
      border: none;
      color: #b84040;
      font-size: 12px;
      cursor: pointer;
      padding: 4px 6px;
    }

    .preview-box {
      margin-top: 8px;
      display: none;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--muted);
    }
    .preview-box img {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>🌿 我的人生卡片</h1>
      <p style="font-size: 12px; color: var(--muted);">给儿子的岁月回忆手账</p>
    </div>
    <span class="status-badge">💾 本地安全保存</span>
  </header>

  <div class="tabs-wrapper">
    <div id="tabsContainer" class="tabs"></div>
    <button class="manage-cat-btn" onclick="openCatModal()">⚙️ 管理</button>
  </div>

  <div id="cardContainer" class="card-list"></div>

  <button class="fab" onclick="openCreateDialog()">+ 记一张新卡片</button>

  <!-- 录入与编辑卡片弹窗 -->
  <div id="dialogMask" class="modal-mask">
    <div class="modal">
      <h2 id="modalTitle">新增人生卡片 (5W1H)</h2>
      <form id="recordForm" onsubmit="saveCardData(event)">
        <input type="hidden" id="editCardId" value="" />

        <div class="group">
          <label>圈层分类</label>
          <select id="fCategory" onchange="checkNewCategorySelect(this)" required></select>
        </div>

        <div class="group">
          <label>事件标题 (What)</label>
          <input type="text" id="fTitle" placeholder="如：教儿子骑自行车、老厨房里的味道" required />
        </div>

        <div style="display: flex; gap: 10px;">
          <div class="group" style="flex: 1;">
            <label>时间 (When)</label>
            <input type="date" id="fDate" required />
          </div>
          <div class="group" style="flex: 1;">
            <label>地点 (Where)</label>
            <input type="text" id="fLocation" placeholder="如：老家、学校" />
          </div>
        </div>

        <div class="group">
          <label>关键人物 (Who)</label>
          <input type="text" id="fWho" placeholder="如：儿子、老公、学生们" />
        </div>

        <div class="group">
          <label>老照片 (选择后自动压缩，不裁切)</label>
          <input type="file" id="fPhoto" accept="image/*" onchange="onPhotoSelected(this)" />
          <div id="existingPhotoPreview" class="preview-box">
            <img id="previewImg" src="" alt="预览" />
            <span>已保留原照片 (如需更换可直接重新选图)</span>
          </div>
        </div>

        <div class="group">
          <label>故事 / 想对他说的心里话</label>
          <textarea id="fStory" placeholder="写下一两句当天的回忆、心情或想传授给他的经验..."></textarea>
        </div>

        <div class="modal-btns">
          <button type="button" class="btn-cancel" onclick="closeDialog()">取消</button>
          <button type="submit" class="btn-submit" id="submitBtn">保存卡片</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 圈层管理弹窗 -->
  <div id="catModalMask" class="modal-mask">
    <div class="modal">
      <h2>⚙️ 管理人生圈层</h2>
      <p style="font-size: 12px; color: var(--muted); margin-bottom: 12px;">您可以随时添加或删除分类，已创建的卡片不会丢失。</p>
      <div class="group" style="display: flex; gap: 8px;">
        <input type="text" id="newCatInput" placeholder="输入新圈层 (如: 教学生涯、独处时光)" />
        <button type="button" onclick="handleAddCategory()" style="width: 76px; background: var(--primary); color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer;">添加</button>
      </div>
      <div id="categoryList" style="margin-top: 12px; max-height: 220px; overflow-y: auto;"></div>
      <div class="modal-btns" style="margin-top: 14px;">
        <button type="button" class="btn-cancel" onclick="closeCatModal()">完成</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_CATEGORIES = ["家人 (儿子/老公)", "父母兄弟姐妹", "朋友/同学/同事"];
    let categories = JSON.parse(localStorage.getItem("demo_categories")) || DEFAULT_CATEGORIES;
    let localCards = JSON.parse(localStorage.getItem("demo_cards")) || [
      {
        id: "demo_1",
        category: "家人 (儿子/老公)",
        title: "第一次教儿子学单车",
        date: "2006-05-18",
        location: "社区小公园",
        who: "儿子、我",
        story: "那天阳光很暖，你在前面摇摇晃晃，我在后面一路小跑护着你。转弯时你突然回头笑，那一刻觉得我的小孩真的长大了。",
        image: null
      }
    ];
    let currentCategory = "全部";
    let editingCardImageCache = null;

    function saveAll() {
      localStorage.setItem("demo_categories", JSON.stringify(categories));
      localStorage.setItem("demo_cards", JSON.stringify(localCards));
    }

    function renderCategoryUI() {
      const tabs = document.getElementById("tabsContainer");
      tabs.innerHTML = "";
      ["全部", ...categories].forEach(cat => {
        const btn = document.createElement("button");
        btn.className = "tab-btn " + (currentCategory === cat ? 'active' : '');
        btn.innerText = cat;
        btn.onclick = () => setTab(cat);
        tabs.appendChild(btn);
      });

      const select = document.getElementById("fCategory");
      select.innerHTML = "";
      categories.forEach(cat => {
        const opt = document.createElement("option");
        opt.value = cat;
        opt.innerText = cat;
        select.appendChild(opt);
      });
      const addOpt = document.createElement("option");
      addOpt.value = "__ADD_NEW__";
      addOpt.innerText = "➕ 自定义新圈层...";
      select.appendChild(addOpt);

      const catList = document.getElementById("categoryList");
      catList.innerHTML = "";
      categories.forEach((cat, idx) => {
        const item = document.createElement("div");
        item.className = "cat-item";
        const span = document.createElement("span");
        span.innerText = cat;
        const delBtn = document.createElement("button");
        delBtn.className = "cat-item-del";
        delBtn.innerText = "删除";
        delBtn.onclick = () => handleRemoveCategory(idx);
        item.appendChild(span);
        item.appendChild(delBtn);
        catList.appendChild(item);
      });
    }

    function handleAddCategory() {
      const val = document.getElementById("newCatInput").value.trim();
      if (!val) return;
      if (categories.includes(val)) { alert("该圈层已存在！"); return; }
      categories.push(val);
      saveAll();
      renderCategoryUI();
      document.getElementById("newCatInput").value = "";
    }

    function handleRemoveCategory(idx) {
      if (categories.length <= 1) { alert("请至少保留一个分类！"); return; }
      const target = categories[idx];
      if (confirm(`确定删除圈层“${target}”吗？`)) {
        categories.splice(idx, 1);
        if (currentCategory === target) currentCategory = "全部";
        saveAll();
        renderCategoryUI();
        renderCards();
      }
    }

    function checkNewCategorySelect(el) {
      if (el.value === "__ADD_NEW__") {
        const name = prompt("请输入新圈层名称：");
        if (name && name.trim()) {
          categories.push(name.trim());
          saveAll();
          renderCategoryUI();
          el.value = name.trim();
        } else {
          el.value = categories[0] || "";
        }
      }
    }

    function renderCards() {
      const box = document.getElementById("cardContainer");
      box.innerHTML = "";
      const filtered = localCards.filter(c => currentCategory === "全部" || c.category === currentCategory);

      if (filtered.length === 0) {
        box.innerHTML = `<div class="empty-hint">暂无“${currentCategory}”的卡片。<br/>点击下方按钮记下第一张吧 ✨</div>`;
        return;
      }

      filtered.forEach(c => {
        const card = document.createElement("div");
        card.className = "life-card";

        // 图片容器
        if (c.image) {
          const imgWrap = document.createElement("div");
          imgWrap.className = "card-img-wrap";
          const img = document.createElement("img");
          img.className = "card-img";
          img.src = c.image;
          img.alt = c.title;
          imgWrap.appendChild(img);
          card.appendChild(imgWrap);
        }

        // 内容体
        const body = document.createElement("div");
        body.className = "card-body";

        const tags = document.createElement("div");
        tags.className = "tags";
        tags.innerHTML = `
          <span class="tag when">📅 ${c.date || "未标注"}</span>
          ${c.location ? `<span class="tag">📍 ${c.location}</span>` : ""}
          ${c.who ? `<span class="tag who">👤 ${c.who}</span>` : ""}
          <span class="tag">${c.category}</span>
        `;
        body.appendChild(tags);

        const title = document.createElement("h3");
        title.className = "card-title";
        title.innerText = c.title;
        body.appendChild(title);

        const story = document.createElement("p");
        story.className = "card-text";
        story.innerText = c.story || "";
        body.appendChild(story);

        // 底部操作按钮
        const footer = document.createElement("div");
        footer.className = "card-footer";

        const editBtn = document.createElement("button");
        editBtn.className = "btn-action btn-edit";
        editBtn.innerText = "✏️ 编辑";
        editBtn.onclick = () => openEditDialog(c.id);

        const delBtn = document.createElement("button");
        delBtn.className = "btn-action btn-del";
        delBtn.innerText = "🗑️ 删除";
        delBtn.onclick = () => deleteCard(c.id);

        footer.appendChild(editBtn);
        footer.appendChild(delBtn);
        body.appendChild(footer);

        card.appendChild(body);
        box.appendChild(card);
      });
    }

    function compressImage(file, maxDimension = 900) {
      return new Promise((resolve) => {
        if (!file) return resolve(null);
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement("canvas");
            let w = img.width, h = img.height;
            if (w > maxDimension || h > maxDimension) {
              if (w > h) { h = Math.round((h * maxDimension) / w); w = maxDimension; }
              else { w = Math.round((w * maxDimension) / h); h = maxDimension; }
            }
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL("image/jpeg", 0.8));
          };
        };
      });
    }

    function openCreateDialog() {
      document.getElementById("modalTitle").innerText = "新增人生卡片 (5W1H)";
      document.getElementById("editCardId").value = "";
      document.getElementById("recordForm").reset();
      document.getElementById("fDate").value = new Date().toISOString().split("T")[0];
      editingCardImageCache = null;
      document.getElementById("existingPhotoPreview").style.display = "none";
      document.getElementById("dialogMask").classList.add("open");
    }

    function openEditDialog(cardId) {
      const card = localCards.find(c => c.id === cardId);
      if (!card) return;

      document.getElementById("modalTitle").innerText = "编辑人生卡片";
      document.getElementById("editCardId").value = card.id;
      document.getElementById("fCategory").value = card.category;
      document.getElementById("fTitle").value = card.title;
      document.getElementById("fDate").value = card.date;
      document.getElementById("fLocation").value = card.location || "";
      document.getElementById("fWho").value = card.who || "";
      document.getElementById("fStory").value = card.story || "";
      document.getElementById("fPhoto").value = "";

      editingCardImageCache = card.image || null;
      const previewBox = document.getElementById("existingPhotoPreview");
      if (card.image) {
        document.getElementById("previewImg").src = card.image;
        previewBox.style.display = "flex";
      } else {
        previewBox.style.display = "none";
      }

      document.getElementById("dialogMask").classList.add("open");
    }

    function onPhotoSelected(input) {
      if (input.files && input.files[0]) {
        document.getElementById("existingPhotoPreview").style.display = "none";
      }
    }

    async function saveCardData(e) {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      btn.innerText = "保存中...";
      btn.disabled = true;

      try {
        const editId = document.getElementById("editCardId").value;
        const file = document.getElementById("fPhoto").files[0];
        
        let finalImage = editingCardImageCache;
        if (file) {
          finalImage = await compressImage(file);
        }

        if (editId) {
          const idx = localCards.findIndex(c => c.id === editId);
          if (idx !== -1) {
            localCards[idx].category = document.getElementById("fCategory").value;
            localCards[idx].title = document.getElementById("fTitle").value;
            localCards[idx].date = document.getElementById("fDate").value;
            localCards[idx].location = document.getElementById("fLocation").value;
            localCards[idx].who = document.getElementById("fWho").value;
            localCards[idx].story = document.getElementById("fStory").value;
            localCards[idx].image = finalImage;
          }
        } else {
          const newCard = {
            id: "card_" + Date.now(),
            category: document.getElementById("fCategory").value,
            title: document.getElementById("fTitle").value,
            date: document.getElementById("fDate").value,
            location: document.getElementById("fLocation").value,
            who: document.getElementById("fWho").value,
            story: document.getElementById("fStory").value,
            image: finalImage
          };
          localCards.unshift(newCard);
        }

        saveAll();
        closeDialog();
        renderCards();
      } finally {
        btn.innerText = "保存卡片";
        btn.disabled = false;
      }
    }

    function deleteCard(id) {
      if (confirm("确定要删除这张卡片吗？")) {
        localCards = localCards.filter(c => c.id !== id);
        saveAll();
        renderCards();
      }
    }

    function setTab(cat) {
      currentCategory = cat;
      renderCategoryUI();
      renderCards();
    }

    function closeDialog() {
      document.getElementById("dialogMask").classList.remove("open");
    }
    function openCatModal() {
      document.getElementById("catModalMask").classList.add("open");
    }
    function closeCatModal() {
      document.getElementById("catModalMask").classList.remove("open");
    }

    window.addEventListener("DOMContentLoaded", () => {
      renderCategoryUI();
      renderCards();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
    });
  </script>
</body>
</html>
